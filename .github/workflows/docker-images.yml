      - name: Build and push
        run: |
          cd docker/debian12-cpu/
          docker build --push \
                       --tag kaldiasr/kaldi:latest \
                       --tag kaldiasr/kaldi:cpu-latest  \
                       --tag kaldiasr/kaldi:cpu-latest-openblas  \
                       --tag kaldiasr/kaldi:cpu-debian12-openblas \
